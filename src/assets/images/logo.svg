<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="35%" stop-color="#E8A820" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A820" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E8A820" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient glow background (subtle) -->
  <circle cx="50" cy="50" r="45" fill="url(#glow-grad)" opacity="0.15" />

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gold-grad)" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Central Crest: Dumbbell & Crown -->
  <g>
    <!-- Dumbbell Bar (behind crown) -->
    <rect x="20" y="58" width="60" height="4" rx="2" fill="url(#gold-grad)" />
    
    <!-- Dumbbell Inner Collars -->
    <rect x="30" y="55" width="2" height="10" rx="1" fill="url(#gold-grad)" />
    <rect x="68" y="55" width="2" height="10" rx="1" fill="url(#gold-grad)" />
    
    <!-- Dumbbell Weight Plates -->
    <!-- Left plates -->
    <rect x="24" y="50" width="4" height="20" rx="2" fill="url(#gold-grad)" />
    <rect x="18" y="47" width="4" height="26" rx="2" fill="url(#gold-grad)" />
    <!-- Right plates -->
    <rect x="72" y="50" width="4" height="20" rx="2" fill="url(#gold-grad)" />
    <rect x="78" y="47" width="4" height="26" rx="2" fill="url(#gold-grad)" />

    <!-- Crown (Empire symbol) -->
    <!-- Base of the crown -->
    <path d="M 32 44 L 68 44 C 68 44 65 48 50 48 C 35 48 32 44 32 44 Z" fill="url(#gold-grad)" />
    <!-- Jewels on the base -->
    <circle cx="38" cy="46" r="1" fill="#1C1C1E" />
    <circle cx="50" cy="46" r="1.2" fill="#1C1C1E" />
    <circle cx="62" cy="46" r="1" fill="#1C1C1E" />

    <!-- Peaks of the crown -->
    <path d="M 32 42 L 30 25 L 40 33 L 50 18 L 60 33 L 70 25 L 68 42 Z" fill="url(#gold-grad)" />

    <!-- Pearls on Peaks -->
    <circle cx="30" cy="24" r="1.5" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="40" cy="32" r="1.2" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="50" cy="17" r="2" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="60" cy="32" r="1.2" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="70" cy="24" r="1.5" fill="url(#gold-grad)" filter="url(#glow)" />
    
    <!-- Central Monogram 'ME' cut out or stylized shield -->
    <path d="M 45 42 L 50 36 L 55 42 Z" fill="#1C1C1E" opacity="0.8" />
  </g>
</svg>
